<!DOCTYPE html>
<html lang="mn">
<head>
<!-- Хуудасны тохиргоо: тэмдэгтийн кодчилол, гар утасны харагдац -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Монгол субтитр / Ярианы танилт</title>
<style>
/* Ерөнхий загвар: фонт, фон, өнгө */
body { font-family: system-ui, sans-serif; background: #1b1b1f; color: #eee; margin: 0; padding: 16px; }
/* Агуулгын хязгаарлагч: хамгийн их өргөн, төвд байрлуулах */
.wrap { max-width: 760px; margin: 0 auto; }
/* Карт хэлбэрийн хэсгүүд */
.card { background: #26262c; border-radius: 12px; padding: 14px; margin-bottom: 14px; }
/* Товч загвар */
button { background: #4a6cf7; color: #fff; border: 0; border-radius: 8px; padding: 10px 14px; margin: 4px 4px 4px 0; font-size: 15px; cursor: pointer; }
/* Идэвхгүй товч */
button:disabled { background: #555; cursor: not-allowed; }
/* Текст оруулах талбар */
textarea { width: 100%; min-height: 180px; background: #111; color: #eee; border: 1px solid #444; border-radius: 8px; padding: 10px; font-size: 16px; box-sizing: border-box; }
/* Монгол гарын товчлуурын хэсэг */
.keys { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
.keys button { min-width: 38px; padding: 8px 6px; margin: 0; background: #3a3a44; }
/* Төлөвийн мөр */
.status { font-size: 14px; color: #aaa; margin-top: 6px; }
</style>
</head>
<body>
<div class="wrap">

  <!-- Гарчиг -->
  <h2>Монгол субтитр / Ярианы танилт</h2>
  <p class="status">Эхний ачаалалт дээр загвар татагдана (нэг удаа). Дараа нь интернетгүй ажиллана.</p>

  <!-- 1. Файл сонгох ба бичих хэсэг -->
  <div class="card">
    <b>1. Видео эсвэл аудио сонгох</b><br>
    <!-- Файл оруулах хэсэг: видео/аудио -->
    <input type="file" id="fileInput" accept="video/*,audio/*">
    <br><br>
    <!-- Микрофоноос шууд бичих товч -->
    <button id="recBtn">🎙 Дуу бичих</button>
    <!-- Дууны түвшний хэмжигч: дуу орж байгааг харуулна -->
    <div style="height:10px;background:#111;border-radius:5px;margin-top:8px;">
      <div id="meterBar" style="height:100%;width:0%;background:#4a6cf7;border-radius:5px;"></div>
    </div>
    <!-- Бичлэгийн явсан хугацаа -->
    <div class="status" id="timer"></div>
    <!-- Бичсэн хэсгүүдийн жагсаалт: тоглуулах, устгах, текст -->
    <div id="segList"></div>
  </div>

  <!-- 2. Тохиргоо ба боловсруулах хэсэг -->
  <div class="card">
    <b>2. Тохиргоо</b><br>
    <!-- Ярианы хэл -->
    <select id="lang">
      <option value="mn">Монгол</option>
      <option value="en">English (текст)</option>
      <!-- Англи яриа → монгол орчуулга (NLLB) -->
      <option value="en2mn">English → Монгол орчуулга</option>
    </select>
    <!-- Загварын хэмжээ: чанар ба хурд -->
    <select id="model">
      <option value="Xenova/whisper-tiny">tiny (хурдан, сул)</option>
      <option value="Xenova/whisper-base">base</option>
      <option value="Xenova/whisper-small" selected>small (санал болгож буй утсанд)</option>
      <option value="Xenova/whisper-medium">medium (PC-д сайн)</option>
    </select>
    <br><br>
    <!-- Боловсруулах товчүүд: тохиргоотой нэг картанд байрлана -->
    <b>Боловсруулах</b><br>
    <button id="runBtn" disabled>Субтитр гаргах</button>
    <button id="dlBtn" disabled>SRT татах</button>
    <!-- Текстийг дуугаар уншуулах товч -->
    <button id="speakBtn">🔊 Уншуулах</button>
    <div class="status" id="status">Файл сонгоогүй байна.</div>
  </div>

  <!-- 3. Гаралтын текст -->
  <div class="card">
    <b>3. Текст (засаж болно)</b>
    <!-- Танигдсан текст энд гарна, гараар засаж болно -->
    <textarea id="output" placeholder="Энд текст гарна..."></textarea>

    <!-- Монгол кирилл гарын товчлуурууд -->
    <div class="keys" id="mnKeys"></div>
  </div>

</div>

<!-- Transformers.js (Whisper) -->
<script type="module">
// Transformers.js сан: Whisper загварыг браузер дээр ажиллуулна
import { pipeline, env } from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3";

// Загварыг браузерын кэшид хадгалж, дараа нь интернетгүй ажиллуулах
env.useBrowserCache = true;

// DOM элементүүдийг авах
const fileInput = document.getElementById("fileInput");
const runBtn = document.getElementById("runBtn");
const dlBtn = document.getElementById("dlBtn");
const output = document.getElementById("output");
const statusEl = document.getElementById("status");
const langEl = document.getElementById("lang");
const modelEl = document.getElementById("model");
const recBtn = document.getElementById("recBtn");
const speakBtn = document.getElementById("speakBtn");
const meterBar = document.getElementById("meterBar");
const timerEl = document.getElementById("timer");
const segListEl = document.getElementById("segList");

// Сонгосон файл болон танигдсан сегментүүдийг хадгалах хувьсагч
let selectedFile = null;
let segments = [];
let transcriber = null;
let loadedModel = null;

// Төлөв харуулах функц
function setStatus(msg) {
  // Төлөвийн текстийг шинэчлэх
  statusEl.textContent = msg;
}

// Файл сонгогдох үед
fileInput.addEventListener("change", () => {
  // Сонгосон файлыг авах
  selectedFile = fileInput.files[0] || null;
  // Файл байвал товчийг идэвхжүүлэх
  runBtn.disabled = !selectedFile;
  setStatus(selectedFile ? `Сонгосон: ${selectedFile.name}` : "Файл сонгоогүй байна.");
});

// Загвар ачаалах (сонгосон загвараар)
async function loadModel(modelName) {
  // Өмнөх загвартай адил бол дахин ачаалах шаардлагагүй
  if (transcriber && loadedModel === modelName) return transcriber;
  setStatus("Загвар ачаалж байна (эхний удаа интернет хэрэгтэй)...");
  // Whisper автомат яриа таних pipeline үүсгэх
  transcriber = await pipeline("automatic-speech-recognition", modelName, {
    // Прогресс мэдээллийг статус дээр харуулах
    progress_callback: (p) => {
      if (p.status === "progress") setStatus(`Загвар татаж байна: ${Math.round(p.progress)}%`);
    },
  });
  // Ачаалсан загварын нэрийг хадгалах
  loadedModel = modelName;
  return transcriber;
}

// Орчуулагч загвар (NLLB) ачаалах: англиас монгол руу
let translator = null;
async function loadTranslator() {
  // Аль хэдийн ачаалсан бол дахин ачаалахгүй
  if (translator) return translator;
  setStatus("Орчуулах загвар ачаалж байна (эхний удаа интернет хэрэгтэй)...");
  // NLLB-200 жижиг хувилбар, браузер дээр ажиллана
  translator = await pipeline("translation", "Xenova/nllb-200-distilled-600M", {
    progress_callback: (p) => {
      if (p.status === "progress") setStatus(`Орчуулах загвар татаж байна: ${Math.round(p.progress)}%`);
    },
  });
  return translator;
}

// Видеоны дууг 16kHz моно болгож авах (Whisper-ийн шаардлага)
async function getAudio(file) {
  // Файлыг ArrayBuffer болгож унших
  const buf = await file.arrayBuffer();
  // Аудио контекст үүсгэх (16kHz)
  const ctx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
  // Дууг декодлох (видеоны audio track-ийг ч авна)
  const audio = await ctx.decodeAudioData(buf);
  // Моно сувгийг авах
  return audio.getChannelData(0);
}

// Секундыг SRT цагийн формат руу хөрвүүлэх (00:00:00,000)
function toSrtTime(sec) {
  // Цаг, минут, секунд, миллисекунд тооцоолох
  const h = Math.floor(sec / 3600);
  const m = Math.floor((sec % 3600) / 60);
  const s = Math.floor(sec % 60);
  const ms = Math.round((sec - Math.floor(sec)) * 1000);
  // Тэг нэмж хоёр/гурван оронтой болгох
  const p = (n, l = 2) => String(n).padStart(l, "0");
  return `${p(h)}:${p(m)}:${p(s)},${p(ms, 3)}`;
}

// Танигдсан сегментүүдийг SRT текст болгох
function buildSrt(list) {
  // Сегмент бүрийг дугаар, цаг, текстээр нь бүрдүүлэх
  return list
    .map((seg, i) => `${i + 1}\n${toSrtTime(seg.start)} --> ${toSrtTime(seg.end)}\n${seg.text.trim()}\n`)
    .join("\n");
}

// "Субтитр гаргах" товч дарагдах үед (видео/аудио файлаар)
runBtn.addEventListener("click", async () => {
  // Файлгүй бол зогсоох
  if (!selectedFile) return;
  runBtn.disabled = true;
  dlBtn.disabled = true;
  try {
    // Загвараа ачаалах
    const asr = await loadModel(modelEl.value);
    // Дууг авах
    setStatus("Дууг боловсруулж байна...");
    const audio = await getAudio(selectedFile);
    setStatus("Яриаг танж байна (урт видео удаан байж болно)...");
    // Орчуулгын горим бол Whisper-ийг англи хэлээр ажиллуулна
    const isTranslate = langEl.value === "en2mn";
    const result = await asr(audio, {
      language: isTranslate ? "en" : langEl.value, // Ярианы хэл (орчуулгад англи)
      task: "transcribe",          // Ярианыг тэр хэлээрээ текст болгох
      return_timestamps: true,     // Цагийн тэмдэгт авах
      chunk_length_s: 30,          // 30 секундийн хэсгээр боловсруулах (санах ойд ачаалал багасна)
      stride_length_s: 5,          // Хэсгүүдийн давхцал (үгийн тасралтаас сэргийлнэ)
    });
    // Үр дүнг сегмент болгон хадгалах
    segments = (result.chunks || []).map((c) => ({
      start: c.timestamp[0] ?? 0,
      end: c.timestamp[1] ?? (c.timestamp[0] ?? 0) + 2,
      text: c.text,
    }));
    // Орчуулгын горим бол сегмент бүрийг монголоор орчуулах
    if (isTranslate && segments.length) {
      const tr = await loadTranslator();
      for (let i = 0; i < segments.length; i++) {
        setStatus(`Орчуулж байна: ${i + 1} / ${segments.length}`);
        // Англи → монгол (кирилл): NLLB-ийн кодоор заана
        const out = await tr(segments[i].text.trim(), {
          src_lang: "eng_Latn",
          tgt_lang: "khk_Cyrl",
        });
        segments[i].text = out[0].translation_text;
      }
    }
    // Текстээ харуулах
    output.value = segments.map((s) => s.text.trim()).join(" ");
    dlBtn.disabled = segments.length === 0;
    setStatus(`Дууслаа. ${segments.length} хэсэг танигдлаа. Засаад SRT татаж болно.`);
  } catch (err) {
    // Алдааг харуулах
    console.error(err);
    setStatus("Алдаа гарлаа: " + err.message);
  } finally {
    // Товчийг дахин идэвхжүүлэх
    runBtn.disabled = false;
  }
});

// "SRT татах" товч: засварласан текстээр SRT файл үүсгэх
dlBtn.addEventListener("click", () => {
  // Текст засагдсан бол сегментийг нэг хэсэг болгож шинэчлэх (энгийн арга)
  const lines = output.value.split(/(?<=[.!?])\s+/).filter(Boolean);
  // Хугацааг сегментүүдээс тараах
  const total = segments.length ? segments[segments.length - 1].end : lines.length * 3;
  const step = total / Math.max(lines.length, 1);
  // Шинэ сегментүүд үүсгэх
  const edited = lines.map((text, i) => ({ start: i * step, end: (i + 1) * step, text }));
  // SRT файл үүсгэж татах
  const blob = new Blob([buildSrt(edited)], { type: "text/plain;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "subtitle.srt";
  a.click();
});

// ===== Шууд бичлэгийн хэсэг =====

// Хэсэглэлт хасагдсан: бичлэг зогсох хүртэл бүх дууг нэг дор хадгална
const RATE = 16000;         // Whisper-ийн шаардах дээжлэлтийн хурд
let liveStream = null;      // Микрофоны урсгал
let liveCtx = null;         // Аудио контекст
let liveProc = null;        // Дууг шууд авах процессор
let liveRunning = false;    // Бичиж байгаа эсэх
let pcmParts = [];          // Одоогийн хэсгийн дээжүүд (хэсэгчилсэн)
let pcmLen = 0;             // Одоогийн хэсгийн нийт дээжийн тоо
let curLevel = 0;           // Одоогийн дууны түвшин (0–100)
let items = [];             // Бичсэн бүх хэсгүүд
let itemQueue = [];         // Танигдах хүлээгдэж буй хэсгүүд
let itemCounter = 0;        // Хэсгийн дугаарлагч
let busy = false;           // Танилт явагдаж байгаа эсэх
let timerId = null;         // Түвшин, цаг шинэчлэх интервал
let startT = 0;             // Бичлэг эхэлсэн цаг

// Дээжүүдийг нэг массив болгох
function concatParts(parts, total) {
  // Нийт урттай шинэ массив үүсгэх
  const out = new Float32Array(total);
  let off = 0;
  // Хэсэг бүрийг дараалуулан хуулах
  for (const p of parts) { out.set(p, off); off += p.length; }
  return out;
}

// Дээжийн хурдыг 16kHz руу хөрвүүлэх (ойролцоогоор)
function toRate16k(samples, fromRate) {
  // Аль хэдийн 16kHz бол юу ч хийхгүй
  if (fromRate === RATE) return samples;
  // Хурдны харьцаа
  const ratio = fromRate / RATE;
  const outLen = Math.floor(samples.length / ratio);
  const out = new Float32Array(outLen);
  // Ойрын дээжийг авах
  for (let i = 0; i < outLen; i++) out[i] = samples[Math.floor(i * ratio)];
  return out;
}

// Дээжийг WAV файл (тоглуулахад) болгох
function encodeWav(samples, rate) {
  // WAV толгой + дээжийн өгөгдлийн буфер
  const buf = new ArrayBuffer(44 + samples.length * 2);
  const v = new DataView(buf);
  // Текстийг байтээр бичих туслах функц
  const w = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  w(0, "RIFF"); v.setUint32(4, 36 + samples.length * 2, true); w(8, "WAVE");
  w(12, "fmt "); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  w(36, "data"); v.setUint32(40, samples.length * 2, true);
  // Дээжүүдийг 16-бит болгох
  for (let i = 0; i < samples.length; i++) {
    const s = Math.max(-1, Math.min(1, samples[i]));
    v.setInt16(44 + i * 2, s < 0 ? s * 0x8000 : s * 0x7fff, true);
  }
  return new Blob([buf], { type: "audio/wav" });
}

// Бэлэн хэсгийг жагсаалтад нэмж, танилтад оруулах
function cutSegment(samples16k) {
  // Хэт богино (0.5 секундээс бага) хэсгийг алгасах
  if (samples16k.length < RATE / 2) return;
  itemCounter++;
  const item = {
    n: itemCounter,
    samples: samples16k,                          // Танихад хэрэглэх дээж
    url: URL.createObjectURL(encodeWav(samples16k, RATE)), // Тоглуулахад
    text: "",
    status: "хүлээж байна",
  };
  items.push(item);
  itemQueue.push(item);
  renderItems();
  processQueue();
}

// Микрофоны дууг тасралтгүй авах процессор
function startCapture(stream) {
  // Аудио контекст үүсгэх
  liveCtx = new (window.AudioContext || window.webkitAudioContext)();
  // Микрофоны урсгалыг контекст руу холбох
  const src = liveCtx.createMediaStreamSource(stream);
  // Дууг 4096 дээжээр авах процессор
  liveProc = liveCtx.createScriptProcessor(4096, 1, 1);
  // Хэсгийн дээжийн тоо (контекстийн хурдаар)
  // Хэсэг тасалдаггүй: дээжийн тоо хязгааргүй
  const segLen = Infinity;
  liveProc.onaudioprocess = (e) => {
    // Ирсэн дууг хуулж авах
    const input = new Float32Array(e.inputBuffer.getChannelData(0));
    pcmParts.push(input);
    pcmLen += input.length;
    // Түвшний хэмжилт (RMS)
    let sq = 0;
    for (const x of input) sq += x * x;
    curLevel = Math.min(100, Math.sqrt(sq / input.length) * 300);
    // Хэсэг дүүрсэн бол тасалж, үлдсэнийг дараагийн хэсэгт үлдээх
    if (pcmLen >= segLen) {
      const all = concatParts(pcmParts, pcmLen);
      const seg = all.slice(0, segLen);
      const rest = all.slice(segLen);
      pcmParts = rest.length ? [rest] : [];
      pcmLen = rest.length;
      cutSegment(toRate16k(seg, liveCtx.sampleRate));
    }
  };
  // Процессор ажиллахын тулд чимээгүй гаралтаар холбох (дуу хаашаа ч гарахгүй)
  const mute = liveCtx.createGain();
  mute.gain.value = 0;
  src.connect(liveProc);
  liveProc.connect(mute);
  mute.connect(liveCtx.destination);
}

// Зогсоохдоо үлдсэн дууг сүүлийн хэсэг болгох
function flushRemainder() {
  // Үлдсэн дуу байвал хэсэг болгох
  if (pcmLen > 0) {
    const all = concatParts(pcmParts, pcmLen);
    pcmParts = [];
    pcmLen = 0;
    cutSegment(toRate16k(all, liveCtx.sampleRate));
  }
}

// Хүлээгдэж буй хэсгүүдийг нэг нэгээр текст болгох
async function processQueue() {
  // Аль хэдийн явж байвал давхар ажиллуулахгүй
  if (busy) return;
  busy = true;
  try {
    while (itemQueue.length) {
      // Дараагийн хэсгийг авч, "танигдаж байна" гэж харуулах
      const item = itemQueue.shift();
      item.status = "танигдаж байна";
      renderItems();
      // Загварыг ачаалах (аль хэдийн байвал шууд авна)
      const asr = await loadModel(modelEl.value);
      const isTranslate = langEl.value === "en2mn";
      // Хэсгийн дээжийг шууд танина (16kHz)
      // Урт аудиог Whisper 30 секундын цонхоор зөв хуваан танина
      const result = await asr(item.samples, {
        language: isTranslate ? "en" : langEl.value,
        task: "transcribe",
        chunk_length_s: 30,   // 30 секундийн цонх
        stride_length_s: 5,   // Цонхнуудын давхцал (үг тасрахаас сэргийлнэ)
      });
      let text = (result.text || "").trim();
      // Орчуулгын горим бол монголоор орчуулах
      if (isTranslate && text) {
        const tr = await loadTranslator();
        const out = await tr(text, { src_lang: "eng_Latn", tgt_lang: "khk_Cyrl" });
        text = out[0].translation_text;
      }
      // Текстийг хэсэгт хадгалж, бүх текстийг дахин бүтээх
      item.text = text;
      item.status = "бэлэн";
      rebuildOutput();
      renderItems();
    }
  } catch (err) {
    // Алдаа гарвал хэсгийн төлөвт бичих
    console.error(err);
    setStatus("Алдаа гарлаа: " + err.message);
  }
  busy = false;
}

// Бүх хэсгийг дэлгэцэнд дахин зурах
function renderItems() {
  // Жагсаалтыг цэвэрлэх
  segListEl.innerHTML = "";
  items.forEach((it) => {
    // Нэг хэсгийн мөр
    const row = document.createElement("div");
    row.style.cssText = "border-bottom:1px solid #333;padding:8px 0;";
    // Дугаар ба төлөв
    const head = document.createElement("div");
    head.textContent = `#${it.n} · ${it.status}`;
    head.style.cssText = "font-size:13px;color:#aaa;";
    // Бичсэн дууг тоглуулах
    const audio = document.createElement("audio");
    audio.controls = true;
    audio.src = it.url;
    audio.style.cssText = "width:100%;margin-top:4px;";
    // Танигдсан текст
    const txt = document.createElement("div");
    txt.textContent = it.text;
    txt.style.cssText = "margin-top:4px;";
    // Хэсгийг устгах товч
    const del = document.createElement("button");
    del.textContent = "🗑 Устгах";
    del.style.cssText = "background:#7a2e2e;margin-top:4px;";
    del.addEventListener("click", () => {
      // Жагсаалтаас хасаад текстийг дахин бүтээх
      items = items.filter((x) => x !== it);
      rebuildOutput();
      renderItems();
    });
    row.append(head, audio, txt, del);
    segListEl.appendChild(row);
  });
}

// Текст талбарыг бэлэн текстүүдээс бүтээх
function rebuildOutput() {
  output.value = items.filter((x) => x.text).map((x) => x.text).join("\n");
}

// Түвшин, цаг, товчийн төлөвийг секунд тутам шинэчлэх (фокусаас хамаарахгүй)
function startTimers() {
  // Бичлэгийн эхлэх цаг
  startT = Date.now();
  timerId = setInterval(() => {
    // Дууны түвшний зурвасыг шинэчлэх
    meterBar.style.width = curLevel + "%";
    // Явсан хугацааг минут:секундээр харуулах
    const sec = Math.floor((Date.now() - startT) / 1000);
    timerEl.textContent = `Бичиж байна: ${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, "0")}`;
  }, 200);
}

// "Дуу бичих" товч: эхлүүлэх / зогсоох
recBtn.addEventListener("click", async () => {
  // Бичиж байгаа бол зогсоох
  if (liveRunning) {
    liveRunning = false;
    clearInterval(timerId);
    // Сүүлийн үлдэгдэл дууг хэсэг болгох
    flushRemainder();
    // Микрофоныг суллах
    liveProc.disconnect();
    liveStream.getTracks().forEach((t) => t.stop());
    liveCtx.close();
    recBtn.textContent = "🎙 Дуу бичих";
    setStatus("Зогсоож байна, сүүлийн хэсгүүдийг танина...");
    // Бүх хэсэг танигдаж дуустал хүлээх
    while (busy || itemQueue.length) await new Promise((r) => setTimeout(r, 300));
    meterBar.style.width = "0%";
    setStatus("Бичлэг дууслаа. Текстээ засаад SRT татаж болно.");
    dlBtn.disabled = output.value.trim() === "";
    return;
  }
  try {
    // Микрофоны зөвшөөрөл авах
    liveStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    // Загварыг урьдчилан ачаалах
    await loadModel(modelEl.value);
    // Хуучин бичлэгийн төлөвийг цэвэрлэх
    items = [];
    itemQueue = [];
    pcmParts = [];
    pcmLen = 0;
    curLevel = 0;
    output.value = "";
    segListEl.innerHTML = "";
    liveRunning = true;
    recBtn.textContent = "⏹ Зогсоох";
    // Дуу авах, цаг/түвшин харуулах эхлүүлэх
    startCapture(liveStream);
    startTimers();
    setStatus("Ярина уу... Текст хэсэг хэсгээрээ гарна.");
  } catch (err) {
    // Микрофон нээгдээгүй бол алдааг харуулах
    setStatus("Микрофон нээгдсэнгүй: " + err.message);
  }
});

// "Уншуулах" товч: текстийг монгол дуугаар уншина
speakBtn.addEventListener("click", () => {
  // Браузерын дуу уншуулах боломжтой эсэх
  if (!("speechSynthesis" in window)) {
    setStatus("Энэ браузер дуугаар уншуулахыг дэмжихгүй.");
    return;
  }
  // Өмнөх уншилтыг зогсоох
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(output.value);
  // Монгол хэлний дуу сонгох (төхөөрөмжөөс хамаарна)
  u.lang = "mn-MN";
  const voice = speechSynthesis.getVoices().find((v) => v.lang.startsWith("mn"));
  if (voice) u.voice = voice;
  else setStatus("Монгол дуу олдсонгүй. Төхөөрөмжийн хэлний тохиргоонд нэмж болно.");
  speechSynthesis.speak(u);
});

// Монгол кирилл гарын товчлуурууд
const mnLetters = "АБВГДЕЁЖЗИЙКЛМНОӨПРСТУҮФХЦЧШЩЪЫЬЭЮЯ".split("");
const keysEl = document.getElementById("mnKeys");
// Үсэг бүрт товч үүсгэх
mnLetters.forEach((ch) => {
  // Товч элемент үүсгэх
  const b = document.createElement("button");
  b.textContent = ch;
  // Дарахад текст талбарт үсэг нэмэх
  b.addEventListener("click", () => {
    output.value += ch;
    output.focus();
  });
  keysEl.appendChild(b);
});
// Цагаан зай ба устгах товч
const space = document.createElement("button");
space.textContent = "Зай";
space.addEventListener("click", () => { output.value += " "; output.focus(); });
keysEl.appendChild(space);
const del = document.createElement("button");
del.textContent = "⌫";
del.addEventListener("click", () => { output.value = output.value.slice(0, -1); output.focus(); });
keysEl.appendChild(del);
</script>
